cubes:
  - name: sales
    sql_table: sales
    dimensions:
      - name: order_id
        sql: order_id
        type: string
        primary_key: true
      - name: order_date
        sql: order_date
        type: time
      - name: ship_date
        sql: ship_date
        type: time
      - name: customer_segment
        sql: customer_segment
        type: string
      - name: region
        sql: region
        type: string
      - name: state
        sql: state
        type: string
      - name: category
        sql: category
        type: string
      - name: sub_category
        sql: sub_category
        type: string
    measures:
      - name: revenue
        sql: sales
        type: sum
      - name: profit
        sql: profit
        type: sum
      - name: quantity
        sql: quantity
        type: sum
      - name: orders
        type: count
      - name: total_discount
        sql: discount
        type: sum
      - name: discounted_sales
        sql: discounted_sales
        type: sum
      - name: shipping_cost
        sql: shipping_cost
        type: sum
      - name: average_order_value
        sql: sales
        type: avg
      - name: average_profit
        sql: profit
        type: avg
      - name: average_discount
        sql: discount
        type: avg
      - name: average_shipping_cost
        sql: shipping_cost
        type: avg
      - name: high_value_orders
        type: count
        filters:
          - sql: "{CUBE}.sales >= 10000"
      - name: loss_orders
        type: count
        filters:
          - sql: "{CUBE}.profit < 0"
      - name: profitable_orders
        type: count
        filters:
          - sql: "{CUBE}.profit > 0"
      - name: discounted_orders
        type: count
        filters:
          - sql: "{CUBE}.discount > 0"
      - name: loss_value
        sql: sales
        type: sum
        filters:
          - sql: "{CUBE}.profit < 0"
